name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting check
        run: test -z "$(gofmt -l ./cmd/ ./internal/)"
      - run: go vet ./...
      - run: go build ./...
      - name: Race tests
        run: go test -race ./... -count=1
      - name: Diff check
        run: git diff --check
